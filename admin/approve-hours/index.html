<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--HALLELUJAH THIS IS ALL THE FONTS WE WILL EVER USE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../master.css">
    
    <title>Approve Hours | PBHS NHS</title>
</head>
<body>
    <div class="all-cont">
        <main class="main-cont">
            <h1 class="important-heading">approve hours</h1>
            <p>ooh you must be the president, a vice president, or the admin. Rock on diva! 💅💅</p>


            <div class="toggle">
                <!--buttons for service and tutoring hours-->
                <button class="toggle-btn active" id="tutoring-btn">Tutoring Requests</button>
                <button class="toggle-btn" id="service-btn">Service Requests</button>
                
            </div>

            <div id="tutoring-requests">
                <!--using the good ol' JS to boot up the tutoring requests lol-->
                <p>no tutoring requests!</p>
                <!--Sample tutoring request-->
                <div class="tutoring-request">
                    <h3 class="important-heading"><span class="tutor">tutor</span> tutored <span class="tutee">tutee</span></h3>
                    <p>On <span class="tutor-date">date</span>, <span class="tutor-time-of-day">time of day</span>, in <span class="tutor-subject">this subject</span>, for <span class="tutor-duration">duration</span> hours</p>
                    <p>Proof of Location:</p>
                    <img src="" alt="">
                    <p>Proof of assignment</p>
                    <img src="" alt="">
                    <div class="approval-buttons">
                        <button class="approved">APPROVE</button>
                        <button class="rejected">REJECT</button>
                    </div>
                </div>
            </div>

            <div id="service-requests" style="display:none">
                <!--And the service requests! Oh yeah!-->
                <p>no service requests!</p>
            </div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
    <script src="../nav.js"></script>
</body>
</html>
