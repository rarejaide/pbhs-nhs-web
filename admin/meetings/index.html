<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--HALLELUJAH THIS IS ALL THE FONTS WE WILL EVER USE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../master.css">
    
    <title>Meeting Logs | PBHS NHS</title>
</head>
<body>
    <div class="all-cont">
        <main class="main-cont">
            <h1 class="important-heading">Meeting logs</h1>
            <p>stay in the know!!</p>
            <p>you may only view ___ meetings</p>
            <button id="new-log"> New log </button>
            <p id="status"></p>
            <div id="meetings-list">
                <div class="meeting">
                    <!-- <details>
                        <summary>
                            <div class="meeting-header">
                                <p class="meeting-num">#[]</p>
                                <p class="header-title important-heading">[TITLE]</p>
                                <p class="header-date">Month DD, YYYY</p>
                            </div>
                        </summary>
                        <div class="meeting-information">
                            <h3 class="important-heading info-title">[TITLE]</h3>
                            <h4 class="important-heading">Agenda</h4>
                            <h4 class="important-heading">Notes</h4>
                        </div>
                    </details> -->
                </div>
            </div>
        </main>
        <!--we're making something to create a new log!!-->
        <div id="new-log-form-cont" style="display: none;">
            <div id="new-log-form">
                <h2 class="important-heading">New log</h2>
                <form id="log-form">
                    <!--Ooh we need a toggle for if it's officer meeting or not-->
                    <label for="log-officer" style="color:var(--gold)">Officer Meeting?</label>
                    <input type="checkbox" id="log-officer" name="log-officer" >
                    <br>
                    <label for="log-title">Title:</label>
                    <input type="text" id="log-title" name="log-title" required>
                    <label for="log-agenda">Agenda:</label>
                    <textarea id="log-agenda" name="log-agenda" required></textarea>
                    <label for="log-notes">Notes:</label>
                    <textarea id="log-notes" name="log-notes" required></textarea>
                    <button type="submit" id="submit-log">Submit</button>
                    <button id="cancel-log" type="button">Cancel</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../nav.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
