<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--HALLELUJAH THIS IS ALL THE FONTS WE WILL EVER USE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../master.css">
    <title>Dashboard | PBHS NHS</title>
</head>
<body>
    <div class="all-cont">
        <main class="main-cont">
            <h1 class="important-heading">welcome, [name]</h1>
            <p id="role"></p>
            <div id="access-message">
                <p>OFFICER ACCESS GRANTED. <span style="color:var(--gold)">ACCESS RESTRICTED BASED ON ROLE</span></p>
            </div>
            <!-- ok now we need an announcements and upcoming events section-->
            <div id="da-dash">
                <div id="announcements" class="normal-section">
                    <h2 class="important-heading">announcements</h2>
                    <p>none right now!!</p>
                </div>
                <div id="your-tasks" class="normal-section">
                    <h2 class="important-heading">your tasks</h2>
                    <p>none right now!! an officer will give you tasks when necessary</p>
                </div>
                <div id="upcoming-events" class="normal-section">
                    <h2 class="important-heading">upcoming events</h2>
                    <p>none right now!!</p>
                </div>
            </div>
        </main>
    </div>
    <script src="../nav.js"></script>
</body>
</html>
