type Student @table {
  firstName: String!
  lastName: String!
  email: String!
  gradeLevel: Int!
  PFP: String!
  joined: Boolean!
  probation: Boolean
  tutoringHours: Int!
  serviceHours: Int!
  hoursLeft: Float!
}

type ServiceLog @table {
  student: Student!
  hours: Float!
  category: String!
  verificationPhoto: String
  dateCompleted: Date
  subject: String
}

type Meeting @table {
  date: Date!
  topic: String!
  agenda: String
  notes: String
}
